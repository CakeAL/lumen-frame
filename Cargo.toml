[package]
name = "lumen-frame"
version = "1.0.0"
edition = "2024"
authors = ["CakeAL <cakeal@qq.com>"]

[dependencies]
tokio = { version = "1", features = ["full"] }
nom-exif = { version = "3", features = ["tokio-fs"] }
anyhow = "1"
vips = "=0.1.0"
vips-sys = "=0.2.0"
dirs = "7"
regex = "1"
num-integer = "0.1"
# 离线将 EXIF GPS 坐标解析为中国省、市、区县。
reverse-geocoder-cn = "0.1"
chrono = "0.4"
# 预览位图：水印合成结果需要转成 GPUI 可渲染的 BGRA 缓冲区，版本必须与 gpui-pre 一致
image = "0.25"
# 预设的序列化（TOML）
serde = { version = "1", features = ["derive"] }
toml = "1"
# 文字排版渲染
parley = "0.11"
swash = "0.2"
peniko = "0.6"
# ui
gpui-kit = "0.6.6"
# FFmpeg sidecar
ffmpeg-sidecar = "2.5.2"
# 从 GitHub Releases 检查并安装新版本。分发包支持 zip 和 tar.gz。
self_update = { version = "1.3.0", features = [
    "archive-zip",
    "compression-zip-deflate",
    "archive-tar",
    "compression-tar-gz",
] }

[dev-dependencies]
# GPUI 的测试上下文（TestAppContext / VisualTestContext）由这个 feature 提供。
gpui-kit = { version = "0.6.6", features = ["test-support"] }

[build-dependencies]
# 只在 Windows 目标构建时把多尺寸 ICO 嵌入 exe。
winresource = "0.1.31"

[profile.release]
# 主程序 29MB → 23MB。GPUI 本身占大头，符号表对最终用户没用。
# 代价：release 构建的崩溃栈不再能符号化，要查线上崩溃请保留一份带符号的构建。
strip = true

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
