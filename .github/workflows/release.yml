name: Build release draft

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate changelog entry
        uses: mindsers/changelog-reader-action@v2
        with:
          path: ./CHANGELOG.md
          version: ${{ steps.version.outputs.version }}

  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install libvips and packaging tools
        run: brew install vips glib gettext dylibbundler create-dmg
      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          bash script/bundle-macos.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: |
            dist/Lumen-Frame-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            dist/Lumen-Frame-${{ needs.metadata.outputs.version }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: metadata
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ runner.temp }}\vcpkg
      VCPKGRS_DYNAMIC: '1'
      VCPKGRS_TRIPLET: x64-windows
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw '克隆 vcpkg 失败' }
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw '安装 vcpkg 失败' }
      - name: Download libvips 8.18.6 x64 development package
        shell: pwsh
        run: |
          $assetName = 'vips-dev-x64-web-8.18.6.zip'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/libvips/build-win64-mxe/releases/tags/v8.18.6' -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "上游 Release 中找不到 $assetName（Windows x86-64 不能使用 arm64 包）" }
          $zip = Join-Path $env:RUNNER_TEMP $assetName
          $extract = Join-Path $env:RUNNER_TEMP 'vips-dev'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $expectedSha256 = '10086f2ccc8e2a861831facabab75fa1b80b4bd03f0a8447623ec581002aa4b2'
          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "libvips 下载文件 SHA-256 不匹配：$actualSha256" }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $imports = @(Get-ChildItem -LiteralPath $extract -Filter libvips.lib -Recurse -File)
          if ($imports.Count -ne 1) { throw "预期一个 libvips.lib，实际找到 $($imports.Count) 个" }
          $vipsDir = Split-Path -Parent (Split-Path -Parent $imports[0].FullName)
          $dll = Join-Path $vipsDir 'bin\libvips-42.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "缺少 $dll" }
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($dll))
          try {
            $reader.BaseStream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
            $peOffset = $reader.ReadInt32()
            $reader.BaseStream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
            $machine = $reader.ReadUInt16()
          } finally { $reader.Dispose() }
          if ($machine -ne 0x8664) { throw "libvips DLL 不是 x86-64（PE Machine: 0x$('{0:X4}' -f $machine)）" }
          "VIPS_DEV_ROOT=$vipsDir" >> $env:GITHUB_ENV
      - name: Install libvips through local vcpkg overlay
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install vips:x64-windows "--overlay-ports=$env:GITHUB_WORKSPACE\vcpkg-overlay"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg 安装 libvips 失败' }
      - name: Build and verify Windows package
        shell: pwsh
        run: ./script/bundle-windows.ps1 -VipsDir $env:VIPS_DEV_ROOT -Variant web -CreateZip
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows-x86_64
          path: dist/Lumen-Frame-${{ needs.metadata.outputs.version }}-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [metadata, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-assets
      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          path: ./CHANGELOG.md
          version: ${{ env.RELEASE_VERSION }}
      - name: Create or update draft Release with changelog
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.changes_file }}
        run: |
          set -euo pipefail
          test -s "$RELEASE_NOTES"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            test "$is_draft" = true || { echo "Refusing to replace an already published Release" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft --title "Lumen Frame $RELEASE_VERSION" \
              --target "$GITHUB_SHA" --notes-file "$RELEASE_NOTES"
          fi
