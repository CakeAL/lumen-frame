# 链接 libvips 的搜索路径。
#
# libvips 的 Rust 绑定只做一件事：`cargo:rustc-link-lib=vips`（外加 glib/gobject）。
# 它不查 pkg-config，也不猜路径 —— 库在哪，完全由这里的 `-L` 决定。
#
# 按目标平台分开写，免得把某个平台的路径带到另一个平台上。

# macOS：Homebrew 的 vips。
# 用 `opt/` 而不是 `Cellar/<精确版本>`：后者会在 `brew upgrade vips` 之后失效。
[target.aarch64-apple-darwin]
rustflags = [
    "-L", "/opt/homebrew/opt/vips/lib",
    "-L", "/opt/homebrew/opt/glib/lib",
    "-L", "/opt/homebrew/opt/gettext/lib",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-L", "/usr/local/opt/vips/lib",
    "-L", "/usr/local/opt/glib/lib",
    "-L", "/usr/local/opt/gettext/lib",
]

# Windows：当前工作区的 vcpkg 与 lumen-frame 同处于 vsc 目录。
# vips-sys 会从 VCPKG_ROOT 探测安装的 libvips.lib 及其依赖。
# 此相对路径以项目根目录为基准；其他目录布局可用环境变量覆盖。
[env]
VCPKG_ROOT = { value = "../vcpkg", relative = true, force = false }
VCPKGRS_DYNAMIC = { value = "1", force = false }
VCPKGRS_TRIPLET = { value = "x64-windows", force = false }
