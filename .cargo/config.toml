# 链接 libvips 的搜索路径。
#
# libvips 的 Rust 绑定只做一件事：`cargo:rustc-link-lib=vips`（外加 glib/gobject）。
# 它不查 pkg-config，也不猜路径 —— 库在哪，完全由这里的 `-L` 决定。
#
# 按目标平台分开写，免得把某个平台的路径带到另一个平台上。

# macOS：Homebrew 的 vips。
# 用 `opt/` 而不是 `Cellar/<精确版本>`：后者会在 `brew upgrade vips` 之后失效。
[target.aarch64-apple-darwin]
rustflags = [
    "-L", "/opt/homebrew/opt/vips/lib",
    "-L", "/opt/homebrew/opt/glib/lib",
    "-L", "/opt/homebrew/opt/gettext/lib",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-L", "/opt/homebrew/opt/vips/lib",
    "-L", "/opt/homebrew/opt/glib/lib",
    "-L", "/opt/homebrew/opt/gettext/lib",
]

# Windows：指向解压官方预编译包之后的 `lib\` 目录（里面有 vips.lib / glib-2.0.lib …）。
#
# 路径因人而异，不写死在这里。构建前设一次环境变量即可：
#
#   PowerShell:
#     $env:RUSTFLAGS = "-L C:\vips\vips-dev-w64-web-8.18.6\lib"
#     cargo build --release
#
# 详见 docs/packaging.md。
