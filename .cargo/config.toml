# 链接 libvips 的搜索路径与覆盖配置。
#
# vips-sys 在 macOS 使用 pkg-config 探测，下方保留 Homebrew 的链接搜索路径；
# Windows x64 MSVC 则直接链接官方 build-win64-mxe 预编译包，不经由 vcpkg。
#
# macOS：Homebrew 的 vips。
# 用 `opt/` 而不是 `Cellar/<精确版本>`：后者会在 `brew upgrade vips` 之后失效。
[target.aarch64-apple-darwin]
rustflags = [
    "-L", "/opt/homebrew/opt/vips/lib",
    "-L", "/opt/homebrew/opt/glib/lib",
    "-L", "/opt/homebrew/opt/gettext/lib",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-L", "/usr/local/opt/vips/lib",
    "-L", "/usr/local/opt/glib/lib",
    "-L", "/usr/local/opt/gettext/lib",
]

# Windows x64 MSVC：跳过 vips-sys 默认的 vcpkg 探测，直接链接官方预编译包的导入库。
# 官方 build-win64-mxe 归档中的导入库名为 libvips.lib / libglib-2.0.lib / libgobject-2.0.lib；
# 库搜索路径由 `crates/core/build.rs` 按 `VIPS_DEV_ROOT` / `LIBVIPS_LIB_DIR` 注入。
[target.x86_64-pc-windows-msvc.vips]
rustc-link-lib = [
    "dylib=libvips",
    "dylib=libglib-2.0",
    "dylib=libgobject-2.0",
]
